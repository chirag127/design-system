name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write        # required for npm provenance
  packages: write        # required for GitHub Packages

jobs:
  release:
    name: Build + Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # ── Publish to npm (with provenance) ──────────────────────────────────
      # pnpm -r converts workspace:* deps to real versions and skips any
      # package whose version is already published.
      - name: Publish to npm
        run: pnpm -r publish --provenance --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Re-configure for GitHub Packages ──────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: '@chirag127'

      - name: Publish to GitHub Packages
        # Point the @chirag127 scope at GitHub Packages, then publish.
        # provenance is npm-registry-only, so it is omitted here.
        run: |
          echo "@chirag127:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm -r publish --access public --no-git-checks || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
