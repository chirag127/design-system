name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      # oz-ai publishes ESM + type defs — verify the exported types resolve.
      - name: Check exported types (oz-ai)
        run: pnpm --filter @chirag127/oz-ai exec attw --pack . --profile esm-only
